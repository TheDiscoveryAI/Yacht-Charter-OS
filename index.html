<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TheDiscoveryAI Charter OS - Meridian Yacht Charter</title>
<style>:root{--bg:#0a0b0d;--p:#16171b;--p2:#1d1e24;--p3:#24262d;--ln:#2b2d35;--tx:#f3f4f6;--mu:#8d91a5;--mu2:#6b6f82;--bl:#3b6fdc;--bl2:#4c88ff;--tl:#6ee7c8;--tl2:#4aa3c7;--or:#f5a524;--rd:#ef5b5b;--gn:#3ddc97;--pu:#9b7bff;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:13px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--tx);background:var(--p3);border:1px solid var(--ln);border-radius:10px;padding:7px 10px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--bl2)}
select option{background:#1d1e24}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-thumb{background:#33353d;border-radius:8px}::-webkit-scrollbar-track{background:transparent}
a{color:var(--bl2)}
#app{display:grid;grid-template-columns:62px 1fr;height:100vh;width:100vw}
#rail{background:#0e0f12;border-right:1px solid #17181c;display:flex;flex-direction:column;align-items:stretch;padding:12px 7px;gap:3px;overflow:hidden;transition:width .18s;width:62px;z-index:30;position:relative}
#rail:hover{width:210px;box-shadow:12px 0 40px rgba(0,0,0,.5)}
.rb{display:flex;align-items:center;gap:14px;padding:9px 12px;border-radius:12px;color:var(--mu);white-space:nowrap;width:100%;text-align:left}
.rb svg{flex:0 0 20px;width:20px;height:20px}
.rb span{opacity:0;transition:opacity .15s;font-size:12.5px}
#rail:hover .rb span{opacity:1}
.rb:hover{background:#1a1b20;color:#fff}
.rb.on{background:#1e2a47;color:#fff}.rb.on svg{color:var(--bl2)}
.rlogo{display:flex;align-items:center;gap:12px;padding:4px 8px 12px;margin-bottom:4px;border-bottom:1px solid #1b1c21;white-space:nowrap}
.rlogo i{flex:0 0 24px;height:24px;border-radius:8px;background:linear-gradient(135deg,var(--bl2),var(--tl));display:block}
.rlogo b{opacity:0;font-size:12px;transition:opacity .15s}#rail:hover .rlogo b{opacity:1}
.rsp{flex:1}
#main{display:flex;flex-direction:column;min-width:0;height:100vh;padding:14px 22px 12px;gap:10px}
#hd{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;min-height:44px}
#hd h1{font-size:20px;font-weight:600;letter-spacing:-.2px}
#hd .sub{color:var(--mu);font-size:11.5px;margin-top:2px}
.hpill{display:flex;gap:4px;background:var(--p);border-radius:30px;padding:5px 8px;align-items:center}
.hpill .ib{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:#a9adbd;position:relative}
.hpill .ib:hover{background:var(--p3);color:#fff}
.hpill .ib svg{width:17px;height:17px}
.dot{position:absolute;top:5px;right:6px;min-width:15px;height:15px;border-radius:8px;background:var(--rd);font-size:9px;display:grid;place-items:center;color:#fff;padding:0 3px;font-weight:600}
.srch{display:flex;align-items:center;gap:8px;background:var(--p);border-radius:24px;padding:0 14px;height:34px;margin-right:10px;width:230px}
.srch input{background:none;border:0;padding:0;width:100%}
.srch svg{width:15px;height:15px;color:var(--mu)}
#tabs{display:flex;gap:8px;flex:0 0 auto;flex-wrap:wrap}
.tab{border:1px solid #a7abbb66;border-radius:22px;padding:6px 15px;font-size:12px;color:#e8e9ee;background:transparent;white-space:nowrap}
.tab:hover{border-color:#fff}.tab.on{background:var(--bl);border-color:var(--bl);color:#fff}
#content{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
#content>*{min-height:0}
#content>.card,#content>div:not(.kpis):not(.row){flex:1}
#content>div[style*="grid-template-columns"]{grid-template-rows:minmax(0,1fr)}
.body>.ch,.body>.map,.map>.ch{position:absolute;inset:0;width:auto;height:auto}
.map>.ch{inset:0}
.card{background:var(--p);border-radius:var(--r);padding:14px 16px;min-height:0;min-width:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.card.flat{padding:0}
.card h3{font-size:14px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .sub,.sub{font-size:11px;color:var(--mu)}
.card .body{flex:1;min-height:0;position:relative}
.scr{overflow:auto;min-height:0}
.hero{background:linear-gradient(150deg,#4c88ff 0%,#2748b8 55%,#1c2f86 100%);border:0}
.hero .big{font-size:30px;font-weight:700;letter-spacing:-.5px}
.hero .lab{font-size:11.5px;opacity:.85}
.kpis{display:grid;gap:12px}
.kpi{background:var(--p);border-radius:16px;padding:11px 14px;display:flex;flex-direction:column;justify-content:space-between;min-height:0;cursor:default}
.kpi.lnk{cursor:pointer}.kpi.lnk:hover{background:var(--p2)}
.kpi .l{font-size:11px;color:var(--mu)}.kpi .v{font-size:22px;font-weight:650;letter-spacing:-.4px;margin:3px 0}
.kpi .d{font-size:11px;display:flex;gap:6px;align-items:center}
.up{color:var(--gn)}.dn{color:var(--rd)}.wr{color:var(--or)}
.g12{grid-template-columns:repeat(12,minmax(0,1fr))}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:12px;padding:2px 9px;font-size:10.5px;font-weight:550;white-space:nowrap}
.c-g{background:#10372b;color:var(--gn)}.c-r{background:#3d1a1d;color:#ff8686}.c-o{background:#3d2d10;color:var(--or)}.c-b{background:#16294f;color:#7aa8ff}.c-m{background:#25272e;color:#b6b9c8}.c-p{background:#2a2250;color:#b9a3ff}
table{width:100%;border-collapse:collapse;font-size:12px}
th{position:sticky;top:0;background:var(--p);text-align:left;color:var(--mu);font-weight:500;font-size:11px;padding:7px 8px;border-bottom:1px solid var(--ln);white-space:nowrap;z-index:2;cursor:default}
th.srt{cursor:pointer}th.srt:hover{color:#fff}
td{padding:7px 8px;border-bottom:1px solid #202228;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
tr.rw:hover td{background:#1b1c21;cursor:pointer}
td.r,th.r{text-align:right}
.btn{background:var(--bl);color:#fff;border-radius:20px;padding:7px 15px;font-size:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bl2)}.btn.sm{padding:4px 11px;font-size:11px}
.btn.gh{background:transparent;border:1px solid #a7abbb66}.btn.gh:hover{border-color:#fff;background:#ffffff0d}
.btn.rd{background:#5a1f25}.btn.rd:hover{background:#7a2a32}.btn.gn{background:#14573f}.btn.gn:hover{background:#1b7556}
.plus{width:30px;height:30px;border-radius:50%;background:var(--bl);display:grid;place-items:center;font-size:19px;line-height:1;flex:0 0 30px}
.plus:hover{background:var(--bl2)}
.row{display:flex;gap:8px;align-items:center}.row.sb{justify-content:space-between}.row.w{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px;min-height:0}
.mu{color:var(--mu)}.b{font-weight:600}.tr{text-align:right}.ctr{text-align:center}
.sp{flex:1}
.bar{height:6px;border-radius:4px;background:#2a2c34;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--tl),var(--tl2))}
.bar.o i{background:linear-gradient(90deg,#ffd27a,var(--or))}.bar.r i{background:linear-gradient(90deg,#ff9a9a,var(--rd))}.bar.b i{background:linear-gradient(90deg,#7fb0ff,var(--bl))}
.ch{width:100%;height:100%;min-height:60px;position:relative}
.ch svg{display:block;width:100%;height:100%}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mu)}.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.list>.li{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #202228}
.li.clk{cursor:pointer}.li.clk:hover{background:#1b1c21;border-radius:10px}
.sev{width:8px;height:8px;border-radius:50%;flex:0 0 8px}.sev.h{background:var(--rd);box-shadow:0 0 8px var(--rd)}.sev.m{background:var(--or)}.sev.l{background:var(--tl2)}
.ico{width:30px;height:30px;border-radius:10px;background:var(--p3);display:grid;place-items:center;flex:0 0 30px;color:var(--mu)}
.ico svg{width:16px;height:16px}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#3b6fdc,#6ee7c8);display:grid;place-items:center;font-size:11px;font-weight:700;color:#06121f;flex:0 0 30px}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:100;padding:30px}
#modal.on{display:flex}
#mbox{background:#202228;border-radius:20px;width:min(980px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px #000c}
#mbox.sm{width:min(560px,100%)}#mbox.lg{width:min(1180px,100%)}
#mh{display:flex;align-items:center;justify-content:space-between;padding:18px 24px 10px}
#mh h2{font-size:18px;font-weight:600}
#mx{width:34px;height:34px;border-radius:50%;font-size:22px;color:var(--mu)}#mx:hover{background:#2c2e36;color:#fff}
#mb{padding:6px 24px 22px;overflow:auto;line-height:1.5}
#mb h4{font-size:13px;margin:12px 0 4px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:#0e2a22;border:1px solid #1b7556;color:#d6ffee;padding:10px 18px;border-radius:14px;opacity:0;transition:.25s;z-index:200;pointer-events:none;max-width:520px}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:#341418;border-color:#7a2a32;color:#ffd5d8}
#drawer{position:fixed;top:0;right:0;bottom:0;width:410px;background:#14151a;border-left:1px solid var(--ln);transform:translateX(105%);transition:transform .22s;z-index:90;display:flex;flex-direction:column;box-shadow:-20px 0 60px #000a}
#drawer.on{transform:none}
#dh{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ln)}
#db{flex:1;overflow:auto;padding:12px 16px;min-height:0}
#df{padding:12px 16px;border-top:1px solid var(--ln)}
.msg{margin:8px 0;max-width:92%;padding:9px 13px;border-radius:14px;line-height:1.5;font-size:12.5px}
.msg.u{background:var(--bl);margin-left:auto;border-bottom-right-radius:4px}
.msg.a{background:var(--p3);border-bottom-left-radius:4px}
.msg table{font-size:11px}.msg td,.msg th{padding:4px 6px;background:none}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.sugg button{border:1px solid #a7abbb55;border-radius:16px;padding:4px 11px;font-size:11px}.sugg button:hover{border-color:#fff}
.field{display:flex;flex-direction:column;gap:4px;margin:6px 0}.field label{font-size:11px;color:var(--mu)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tip{position:fixed;background:#0b0c0e;border:1px solid var(--ln);padding:7px 10px;border-radius:10px;font-size:11px;pointer-events:none;z-index:300;display:none;max-width:260px;line-height:1.4}
.sw{display:inline-block;width:36px;height:20px;border-radius:12px;background:#33353d;position:relative;cursor:pointer;vertical-align:middle}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--bl)}.sw.on:after{left:18px}
.stat{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #202228;font-size:12px}
.stat span:first-child{color:var(--mu)}
.map{position:relative;width:100%;height:100%;background:radial-gradient(ellipse at 30% 20%,#13243a,#0b1522 70%);border-radius:14px;overflow:hidden}
.pin{cursor:pointer}
.hm{display:grid;gap:3px}
.hm div{border-radius:4px;font-size:10px;display:grid;place-items:center;min-height:20px}
.gantt{position:relative;overflow:auto}
.lp{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:12px;color:var(--mu)}
.sel{display:flex;gap:6px;align-items:center}
.sel select{padding:4px 8px;font-size:11.5px;border-radius:14px}
#login{position:fixed;inset:0;z-index:500;background:var(--bg);display:grid;place-items:center}
@media (max-width:1100px){.srch{display:none}}
</style></head><body>
<div id="app"><nav id="rail"></nav><main id="main"><header id="hd"></header><div id="tabs"></div><section id="content"></section></main></div>
<div id="modal"><div id="mbox"><div id="mh"><h2></h2><button id="mx" aria-label="Close">×</button></div><div id="mb"></div></div></div>
<aside id="drawer"><div id="dh"></div><div id="db"></div><div id="df"></div></aside>
<div id="toast"></div><div class="tip" id="tip"></div>

function vesselUtil(v,f,t){let u=0,c=0;for(let d=f;d<t;d++){if(DB.windows.some(w=>w.vessel===v.id&&dN(w.start)<=d&&dN(w.end)>=d))continue;c++;if(DB.bookings.some(b=>b.vessel===v.id&&b.status!=='Cancelled'&&dN(b.start)<=d&&dN(b.end)>d))u++}return c?u/c:0}
function geoProject(pts,w,h,pad=40){const la=pts.map(p=>p.lat),lo=pts.map(p=>p.lon),mnla=Math.min(...la),mxla=Math.max(...la),mnlo=Math.min(...lo),mxlo=Math.max(...lo),kx=Math.cos((mnla+mxla)/2*Math.PI/180);let sx=(w-2*pad)/Math.max(.01,(mxlo-mnlo)*kx),sy=(h-2*pad)/Math.max(.01,mxla-mnla),s=Math.min(sx,sy);const ox=(w-(mxlo-mnlo)*kx*s)/2,oy=(h-(mxla-mnla)*s)/2;return p=>[ox+(p.lon-mnlo)*kx*s,h-oy-(p.lat-mnla)*s]}
function chartBg(w,h){let s='';for(let x=0;x<w;x+=60)s+=`<line x1="${x}" x2="${x}" y1="0" y2="${h}" stroke="#ffffff0a"/>`;for(let y=0;y<h;y+=60)s+=`<line x1="0" x2="${w}" y1="${y}" y2="${y}" stroke="#ffffff0a"/>`;[[.2,.3,120],[.7,.25,160],[.5,.75,140],[.85,.7,100]].forEach(([a,b,r])=>s+=`<circle cx="${w*a}" cy="${h*b}" r="${r}" fill="#1c3a5c" opacity=".22"/>`);return s}
function fleetMap(baseSel){
  const pts=baseSel==='all'?DB.vessels.map(v=>({lat:v.lat,lon:v.lon})):[...DB.way[baseSel],...DB.vessels.filter(v=>v.base===baseSel)];

    let P,vs=DB.vessels.filter(v=>baseSel==='all'||v.base===baseSel),s=chartBg(w,h);
    if(baseSel==='all'){const lo=Math.min(...DB.bases.map(b=>b.lon)),la=Math.min(...DB.bases.map(b=>b.lat));
      /* inset layout: 4 regional panels */
      const pw=w/2,ph=h/2;s='';DB.bases.forEach((b,i)=>{const ox=(i%2)*pw,oy=Math.floor(i/2)*ph;const pr=geoProject([...DB.way[b.id].map(x=>({lat:x.lat,lon:x.lon})),...DB.vessels.filter(v=>v.base===b.id)],pw,ph,34);
        s+=`<g transform="translate(${ox},${oy})"><rect x="6" y="6" width="${pw-12}" height="${ph-12}" rx="14" fill="#0e1c2e" stroke="#ffffff10"/><text x="18" y="26" fill="#c9ccd8" font-size="12" font-weight="600">${bnShort(b.id)} - ${b.country}</text>`;

        DB.vessels.filter(v=>v.base===b.id).forEach(v=>{const q=pr(v),c={Chartered:'#4c88ff',Available:'#6ee7c8',Maintenance:'#f5a524',Turnaround:'#9b7bff'}[v.status];s+=`<g class="pin" data-act="vessel:${v.id}" data-tip="<b>${E(v.name)}</b><br>${E(v.model)}<br>${v.status} - ${E(v.at)}${v.sog?'<br>'+v.sog+' kn, hdg '+v.hdg+'°':''}"><circle cx="${q[0]}" cy="${q[1]}" r="12" fill="transparent"/><circle cx="${q[0]}" cy="${q[1]}" r="${v.status==='Chartered'?7:5}" fill="${c}" opacity=".25"/><circle cx="${q[0]}" cy="${q[1]}" r="3.8" fill="${c}"/></g>`});s+='</g>'});
      return`<svg viewBox="0 0 ${w} ${h}">${s}</svg>`}
    P=geoProject(pts,w,h,56);

    DB.way[baseSel].forEach(wp=>{const q=P(wp);s+=`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="#223b5b" stroke="#4a6a8c"/><text x="${q[0]+8}" y="${q[1]+4}" fill="#7fa0c8" font-size="10.5">${E(wp.n)}</text>`});

    vs.forEach(v=>{const q=P(v),c={Chartered:'#4c88ff',Available:'#6ee7c8',Maintenance:'#f5a524',Turnaround:'#9b7bff'}[v.status];s+=`<g class="pin" data-act="vessel:${v.id}" data-tip="<b>${E(v.name)}</b><br>${E(v.model)}<br>${v.status} - ${E(v.at)}${v.sog?'<br>'+v.sog+' kn, hdg '+v.hdg+'°':''}"><circle cx="${q[0]}" cy="${q[1]}" r="16" fill="transparent"/><circle cx="${q[0]}" cy="${q[1]}" r="${v.status==='Chartered'?12:8}" fill="${c}" opacity=".22"/><path transform="translate(${q[0]} ${q[1]}) rotate(${v.hdg||0})" d="M0 -7 L5 6 L0 3 L-5 6Z" fill="${c}" stroke="#0b1522"/><text x="${q[0]+9}" y="${q[1]-8}" fill="#e8e9ee" font-size="10" font-weight="600">${E(v.name)}</text></g>`});
    if(wxd.gust>=30)s+=`<g><rect x="${w-212}" y="14" width="198" height="42" rx="10" fill="#3d2d10" stroke="#f5a524"/><text x="${w-200}" y="32" fill="#f5a524" font-size="11" font-weight="600">Wind alert: gusts ${wxd.gust} kn</text><text x="${w-200}" y="47" fill="#ffd9a0" font-size="10">${E(wxd.warn||'Strong wind expected')}</text></g>`;
    return`<svg viewBox="0 0 ${w} ${h}">${s}</svg>`}}

function gantt(vs,off,span){return(w,h)=>{const lw=176,top=34,rh=Math.min(36,Math.max(22,(h-top-4)/vs.length)),cw=(w-lw-8)/span;let s='';

  vs.forEach((v,r)=>{const y=top+r*rh;s+=`<line x1="0" x2="${w}" y1="${y+rh}" y2="${y+rh}" stroke="#202228"/><text x="8" y="${y+rh/2+4}" fill="#e8e9ee" font-size="11.5" font-weight="600" class="pin" data-act="vessel:${v.id}" style="cursor:pointer">${E(v.name)}</text><text x="${lw-6}" y="${y+rh/2+4}" fill="#6b6f82" font-size="9" text-anchor="end">${E(v.model.split(' ').slice(-2).join(' '))}</text>`;
    DB.bookings.filter(b=>b.vessel===v.id&&b.status!=='Cancelled').forEach(b=>{const a=dN(b.start)-off,e=dN(b.end)-off;if(e<0||a>span)return;const x1=lw+Math.max(0,a)*cw,x2=lw+Math.min(span,e)*cw,c={Bareboat:'#4c88ff',Skippered:'#9b7bff',Crewed:'#6ee7c8'}[b.mode],warn=b.mode!=='Bareboat'&&!b.skipper&&dN(b.start)>=0&&dN(b.start)<=21;
      s+=`<g class="pin" data-act="booking:${b.id}" data-tip="<b>${b.id}</b> ${b.mode}<br>${E(CU(b.cust).name)} - ${fD(b.start)} to ${fD(b.end)}<br>${eur(b.gross)} - ${b.status}${warn?'<br><b style=color:#ff8686>No skipper assigned</b>':''}"><rect x="${x1+1}" y="${y+4}" width="${Math.max(2,x2-x1-2)}" height="${rh-8}" rx="5" fill="${c}" opacity="${b.status==='Completed'?.45:.9}" ${warn?'stroke="#ef5b5b" stroke-width="2"':''}/>${x2-x1>46?`<text x="${x1+7}" y="${y+rh/2+3.5}" fill="#06121f" font-size="9.5" font-weight="600">${E(CU(b.cust).name.split(' ').pop())}</text>`:''}</g>`});
    DB.windows.filter(m=>m.vessel===v.id).forEach(m=>{const a=dN(m.start)-off,e=dN(m.end)-off+1;if(e<0||a>span)return;const x1=lw+Math.max(0,a)*cw,x2=lw+Math.min(span,e)*cw;s+=`<g class="pin" data-act="window:${m.id}" data-tip="<b>${E(m.type)}</b><br>${fD(m.start)} to ${fD(m.end)} - ${m.status}<br>${m.yard}"><rect x="${x1+1}" y="${y+4}" width="${Math.max(2,x2-x1-2)}" height="${rh-8}" rx="5" fill="#f5a524" opacity=".9"/><path d="M${x1+1} ${y+4}h${Math.max(2,x2-x1-2)}v${rh-8}h-${Math.max(2,x2-x1-2)}z" fill="url(#hatch)" opacity=".25"/>${x2-x1>40?`<text x="${x1+7}" y="${y+rh/2+3.5}" fill="#2a1a00" font-size="9.5" font-weight="700">${E(m.type.split(' ')[0])}</text>`:''}</g>`})});
  return`<svg viewBox="0 0 ${w} ${h}"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="6" fill="#000"/></pattern></defs>${s}</svg>`}}

function answer(q){const t=q.toLowerCase(),A=alerts();
  if(/skipper|crew gap|no crew|unassign/.test(t)){const g=DB.bookings.filter(b=>needsCrew(b)&&!b.skipper&&dN(b.start)>=0&&dN(b.start)<=14);return`<b>${g.length} charters</b> have no skipper in the next 14 days:<br><table>${g.slice(0,8).map(b=>`<tr><td>${fD(b.start)}</td><td>${V(b.vessel).name}</td><td>${bnShort(b.base)}</td></tr>`).join('')}</table>I can propose replacements in the Scheduler.`}
  if(/part|stock/.test(t)){const o=DB.parts.filter(p=>p.crit==='A'&&DB.bases.some(b=>p.stock[b.id]===0));return`<b>${o.length} critical parts</b> are out of stock somewhere:<br>${o.slice(0,6).map(p=>`- ${p.name} (${DB.bases.filter(b=>p.stock[b.id]===0).map(b=>bnShort(b.id)).join(', ')})`).join('<br>')}`}
  if(/complian|risk|licen|cert|expir/.test(t)){const c=A.filter(a=>a.cat==='Compliance');return`<b>${c.length} compliance items</b> are open, ${c.filter(a=>a.sev==='h').length} urgent. Top: ${c.slice(0,3).map(a=>E(a.title)).join('; ')}.`}
  if(/fail|predict|breakdown|health/.test(t)){const h=[...DB.health].sort((a,b)=>b.p30-a.p30).slice(0,4);return`Highest 30-day failure risk:<br>${h.map(x=>`- ${V(x.vessel).name}: ${pct(x.p30)} (${x.top})`).join('<br>')}`}

  if(/burn|tired|rest/.test(t)){const b=DB.crew.filter(c=>c.burn>=80).sort((x,y)=>y.burn-x.burn).slice(0,5);return`${b.length} crew score 80 or higher:<br>${b.map(c=>`- ${E(c.name)} (${c.role}, ${bnShort(c.base)}) ${c.burn}`).join('<br>')}`}
  if(/margin|profit|revenue|money|cash/.test(t)){const A_=DB.fin.filter(f=>f.actual),r=sum(A_,f=>f.rev);return`Revenue YTD is <b>${eurK(r)}</b>, operating margin ${pct(1-sum(A_,f=>sum(costRows(f),x=>x[1]))/r,1)}. Lowest cash point is ${eurK(Math.min(...DB.cash.map(c=>c.close)))}.`}
  if(/weather|wind|storm|mistral|bora/.test(t)){const w=Object.entries(DB.weather).flatMap(([b,a])=>a.filter(d=>d.warn).map(d=>`- ${bnShort(b)} ${fD(d.day)}: ${E(d.warn)}`));return`Active weather warnings:<br>${w.join('<br>')}`}
  return`I can answer questions on crew, parts, compliance, failures, demand, burnout, margins and weather. There are currently <b>${A.length} open alerts</b>, ${A.filter(a=>a.sev==='h').length} urgent.`}
function runScenario(k){const sk=DB.crew.filter(c=>c.role==='Skipper'),bks=DB.bookings.filter(b=>needsCrew(b)&&dN(b.start)>=0&&dN(b.start)<=14);

  if(k==='storm'){const t=DB.bookings.filter(b=>b.base==='TOR'&&b.status!=='Cancelled'&&dN(b.start)>=0&&dN(b.start)<=3),at=DB.bookings.filter(b=>b.base==='TOR'&&b.status==='In progress');return{title:'Storm closes Tortola for 3 days',k:[['Departures held',t.length],['Boats to shelter',at.length,'#f5a524'],['Revenue shifted',eurK(sum(t,b=>b.gross)*.25),'#ff8686'],['Guest notices',t.length+at.length]],text:'Departures are held, boats at sea are routed to the nearest hurricane-hole moorings, and affected guests receive an automatic notification with a compensation offer capped by policy.',chart:cBar({labels:['Day 1','Day 2','Day 3','Day 4'],series:[{n:'Held departures',c:'#ef5b5b',v:[t.length,Math.round(t.length*.6),Math.round(t.length*.3),0]}]}),acts:[['Send guest notices','scnact:notice'],['Open weather','go:voy/wx']]}}
  if(k==='breakdown'){const top=[...DB.vessels].sort((a,b)=>b.rate_hi-a.rate_hi)[0];return{title:'Engine failure on '+top.name,k:[['Repair time','9 days'],['Charters affected',2,'#f5a524'],['Revenue lost',eurK(top.rate_hi*1.7),'#ff8686'],['Swap candidates',DB.vessels.filter(v=>v.base===top.base&&v.type===top.type&&v.id!==top.id&&v.status==='Available').length||2]],text:'The engine will find a like-for-like swap, notify guests and open a rush work order with the parts supplier.',chart:cBar({labels:['Day 1','Day 3','Day 5','Day 7','Day 9'],series:[{n:'Cumulative loss',c:'#ef5b5b',v:[0,1,2,3,4].map(i=>Math.round(top.rate_hi/7*(i*2+1)))}],fmt:eurK}),acts:[['Create rush work order','scnact:rush'],['Find swap vessel','scnact:swap']]}}
  if(k==='strike'){const aw=DB.workorders.filter(w=>w.status==='Awaiting parts').length;return{title:'Port strike delays parts by 10 days',k:[['Orders delayed',aw+DB.parts.filter(p=>p.onorder.length).length],['Vessels at risk',Math.max(3,aw),'#f5a524'],['Extra downtime',aw*3+' days'],['Local alternatives',DB.parts.filter(p=>p.crit==='A').length]],text:'Critical-A parts can be sourced from local distributors at a 14% premium. The engine recommends transferring stock between bases first.',chart:cBar({labels:['Today','+3d','+6d','+10d'],series:[{n:'Blocked WOs',c:'#ef5b5b',v:[aw,aw+1,aw+3,aw+4]}]}),acts:[['Transfer stock between bases','scnact:transfer'],['Open parts','go:maint/parts']]}}
  const pm=DB.crew.filter(c=>c.permit);return{title:'Work permits delayed for 4 crew',k:[['Crew affected',4],['Charters exposed',3,'#f5a524'],['Start delay','12 days'],['Permit holders',pm.length]],text:'Delayed permits push start dates into December in the Caribbean. The planner suggests moving two skippers from Palma where the season has ended.',chart:cBar({labels:['Nov wk1','Nov wk2','Nov wk3','Nov wk4'],series:[{n:'Unstaffed days',c:'#f5a524',v:[12,8,4,0]}]}),acts:[['Relocate crew from Palma','scnact:relocate'],['Open roster','go:crew/roster']]}}

 reroute:id=>{const b=BK(id),w=DB.way[b.base].slice(1);const r=[...w].sort(()=>Math.random()-.5).slice(0,Math.min(b.route.length-1,w.length));b.route=[{...DB.way[b.base][0],n:DB.way[b.base][0].n,day:0},...r.map((x,i)=>({n:x.n,lat:x.lat,lon:x.lon,day:Math.round((i+1)*(b.days-1)/(r.length)||0)}))];render();toast('Route re-optimised for forecast conditions')},
 sendroute:id=>{audit('Sent route to skipper',id);toast('Route sent to the skipper app')},
 reserveberth:id=>{const p=DB.ports.find(x=>x.id===id);formModal('Reserve at '+p.name,[{k:'n',l:'Berths',t:'number',v:2,min:1},{k:'d',l:'Date',t:'date',v:addD(DB.today,3)}],'Reserve',v=>{if(+v.n>p.free){toast('Only '+p.free+' berths free',1);return false}p.free-=+v.n;p.ours+=+v.n;audit('Reserved berths',p.name+' x'+v.n);toast(v.n+' berths reserved at '+p.name);return true},p.free+' berths free at €'+p.price+' per night.')},
 sendbriefs:()=>{DB.bookings.filter(b=>b.status!=='Cancelled'&&dN(b.start)>=0&&dN(b.start)<=7).forEach(b=>b.briefed=true);audit('Sent briefings','All departures this week');render();toast('Briefings sent to all guests')},
 brief:id=>{const b=BK(id),v=V(b.vessel),w=DB.weather[b.base][Math.min(6,Math.max(0,dN(b.start)))];modal('Briefing - '+v.name,`<div style="line-height:1.7"><p>Welcome ${E(CU(b.cust).name.split(' ')[0])}. Your ${v.model} <b>${v.name}</b> departs ${bn(b.base)} on ${fDY(b.start)} at ${b.checkin}.</p><p><b>Forecast on departure:</b> wind ${w.wind} kn gusting ${w.gust} kn from ${w.dir}, waves ${w.wave} m. ${w.warn?'<b style="color:var(--or)">Note: '+E(w.warn)+'.</b>':'Good sailing conditions.'}</p><p><b>Suggested first leg:</b> ${DB.way[b.base][1].n}, about ${Math.round(nmi(DB.way[b.base][0],DB.way[b.base][1]))} nautical miles.</p><p>Please bring your skipper licence and ID. Safety briefing takes 30 minutes.</p></div><div class="row" style="justify-content:flex-end"><button class="btn" data-act="sendbrief1:${b.id}">Send to guest</button></div>`,'sm')},
 sendbrief1:id=>{BK(id).briefed=true;closeModal();render();toast('Briefing sent')},
 depositcamp:()=>confirmModal('Early-booking campaign','Offer 2027 season guests a 5% discount for a 30% deposit before 15 December. Forecast: +€420k in deposits and 38 additional bookings.','Launch campaign',()=>{audit('Launched campaign','Early booking 2027');toast('Campaign launched')}),
 scnact:k=>{const m={agency:'Agency skippers pre-booked for 5 days',notice:'Guest notices sent',rush:'Rush work order created',swap:'Swap vessel proposed to guests',transfer:'Stock transfers initiated',relocate:'Two skippers relocated from Palma'}[k];audit('Scenario action',m);toast(m)},
 askpage:()=>{const i=$('#chatin2');if(!i||!i.value.trim())return;CHAT.push({r:'u',h:E(i.value)});CHAT.push({r:'a',h:answer(i.value)});render();const l=$('#chatlog2');if(l)l.scrollTop=l.scrollHeight},
 askq:q=>{CHAT.push({r:'u',h:E(q)});CHAT.push({r:'a',h:answer(q)});if($('#drawer').classList.contains('on'))ACT.chat();else{if(S.mod!=='ai'||S.tab!=='chat'){S.mod='ai';S.tab='chat'}render();const l=$('#chatlog2');if(l)l.scrollTop=l.scrollHeight}},
 chat:()=>{openDrawer('Charter OS Copilot',`<div id="chatlog">${chatHTML()}</div><div class="sugg">${QS.slice(0,4).map(q=>`<button data-act="askq:${q}">${q}</button>`).join('')}</div>`,`<div class="row"><input id="chatin" placeholder="Ask about the fleet" style="flex:1;border-radius:20px"><button class="btn" data-act="askd">Ask</button></div>`);const l=$('#db');l.scrollTop=l.scrollHeight},
 askd:()=>{const i=$('#chatin');if(!i.value.trim())return;CHAT.push({r:'u',h:E(i.value)});CHAT.push({r:'a',h:answer(i.value)});ACT.chat();setTimeout(()=>{const x=$('#chatin');x&&x.focus()},0)},
 bell:()=>{const A=alerts();openDrawer('Notifications ('+A.length+')',A.slice(0,25).map(a=>`<div class="li clk" data-act="alert:${a.id}" style="display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid #202228"><span class="sev ${a.sev}" style="margin-top:5px"></span><div><div style="line-height:1.35">${E(a.title)}</div><div class="sub">${a.cat} - ${E(a.detail)}</div></div></div>`).join('')||'<div class="mu ctr" style="padding:30px">All clear</div>',`<div class="row sb"><button class="btn gh sm" data-act="ackall">Dismiss all</button><button class="btn sm" data-go="cmd/alerts">Open Alerts Centre</button></div>`)},
 logout:()=>confirmModal('Sign out','End this demo session and return to the welcome screen?','Sign out',()=>{S.mod='journey';S.tab=null;closeDrawer();toast('Signed out of the demo')}),
 toggle:()=>{},
 policy:id=>{const p=DB.policies.find(x=>x.id===id);modal(p.name,`<div class="stat"><span>Insurer</span><b>${p.insurer}</b></div><div class="stat"><span>Scope</span><b>${p.scope}</b></div><div class="stat"><span>Annual premium</span><b>${eur(p.premium)}</b></div><div class="stat"><span>Excess</span><b>${p.deductible}</b></div><div class="stat"><span>Renewal</span><b>${fDY(p.renew)}</b></div><div class="stat"><span>Claims this period</span><b>${p.claims}</b></div><div class="sub" style="margin-top:10px;line-height:1.5">${p.note}</div>`,'sm')},
 'quote-ins':id=>{audit('Requested renewal quotes',id);toast('Renewal quotes requested from 3 insurers')},
 incident:id=>{const i=DB.incidents.find(x=>x.id===id);modal(i.id+' - '+i.type,`<div class="grid2"><div><div class="stat"><span>Vessel</span><b>${V(i.vessel).name}</b></div><div class="stat"><span>Date</span><b>${fDY(i.date)}</b></div><div class="stat"><span>Severity</span>${chip(i.sev,i.sev==='Major'?'r':i.sev==='Moderate'?'o':'m')}</div><div class="stat"><span>Root cause</span><b>${i.cause}</b></div></div><div><div class="stat"><span>Downtime</span><b>${i.downtime} days</b></div><div class="stat"><span>Cost</span><b>${eur(i.cost)}</b></div><div class="stat"><span>Excess</span><b>${eur(i.deductible)}</b></div><div class="stat"><span>Insured claim</span><b>${i.insured?'Yes':'No'}</b></div></div></div><div class="row" style="margin-top:14px;justify-content:flex-end">${i.status==='Open'?`<button class="btn" data-act="closeinc:${i.id}">Close incident</button>`:chip('Closed','m')}</div>`,'sm')},
 closeinc:id=>{DB.incidents.find(x=>x.id===id).status='Closed';closeModal();render();toast(id+' closed')},
 edituser:id=>{const u=DB.users.find(x=>x.id===id);confirmModal(u.name,'Role: '+u.role+'<br>MFA: '+(u.mfa?'enabled':'disabled')+'<br>Status: '+(u.active?'active':'suspended'),u.active?'Suspend user':'Reactivate user',()=>{u.active=!u.active;audit(u.active?'Reactivated user':'Suspended user',u.name);toast(u.name+(u.active?' reactivated':' suspended'))})},
 integ:a=>{const[n,s]=a.split('|');confirmModal(n,s==='Live'?'Connection healthy. Last sync 2 minutes ago, 99.9% uptime over 30 days.':'This integration is '+s.toLowerCase()+'. Connect it to start syncing data.',s==='Live'?'Run test sync':'Connect',()=>{audit('Integration',n);toast(s==='Live'?'Sync completed':'Connection request sent')})},
 exportdata:()=>{const rows=[['Vessel','Model','Base','Status','Health','Engine hours']].concat(DB.vessels.map(v=>[v.name,v.model,bnShort(v.base),v.status,DB.health.find(h=>h.vessel===v.id).score,v.eh]));const blob=new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='meridian_fleet_report.csv';a.click();toast('Fleet report downloaded')},
 resetdemo:()=>confirmModal('Reset demo data','Restore the original dataset and discard all changes made in this session?','Reset',()=>{DB=JSON.parse(JSON.stringify(DB0));S.ack=new Set();S.audit=[];toast('Demo data restored')}),
 calprev:()=>{S.sel.calOff=(+S.sel.calOff||0)-14;render()},calnext:()=>{S.sel.calOff=(+S.sel.calOff||0)+14;render()},caltoday:()=>{S.sel.calOff=0;render()}
};
ACT['assignH']=id=>assignModal(id,'Chef / Hostess');
function runAct(s){const i=s.indexOf(':'),n=i<0?s:s.slice(0,i),a=i<0?'':s.slice(i+1);const f=ACT[n];if(f)f(a);else{console.warn('No action',s);toast('Action not wired: '+n,1)}}
/* ---- events ---- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-tab],[data-act],[data-sort],#mx,#dx,#modal');
  if(!t)return;
  if(t.id==='modal'&&e.target.id==='modal'){closeModal();return}
  if(t.id==='mx'){closeModal();return}if(t.id==='dx'){closeDrawer();return}
  if(t.dataset.sort){const[id,k]=t.dataset.sort.split('|'),cur=S.sel['sort_'+id];S.sel['sort_'+id]={k:+k,d:cur&&cur.k===+k?-cur.d:1};render();return}
  if(t.dataset.tab){S.tab=t.dataset.tab;render();return}
  if(t.dataset.go){const act=t.dataset.act;closeModal();go(t.dataset.go);return}
  if(t.dataset.act){if(t.dataset.act==='toggle'){t.classList.toggle('on');return}runAct(t.dataset.act)}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.f){S.f[t.dataset.f]=t.value;render(true)}if(t.dataset.ck){const[b,i]=t.dataset.ck.split('|');const k='ck'+b;S.sel[k]=S.sel[k]||{};S.sel[k][i]=t.checked;render()}});
document.addEventListener('input',e=>{const t=e.target;if(t.tagName==='INPUT'&&t.dataset.f&&t.type==='text'||t.tagName==='INPUT'&&t.dataset.f&&!t.type){S.f[t.dataset.f]=t.value;render(true)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer()}
  if(e.key==='Enter'){if(e.target.id==='gs'){gsearch(e.target.value)}else if(e.target.id==='chatin')ACT.askd();else if(e.target.id==='chatin2')ACT.askpage()}});
function gsearch(q){q=q.trim().toLowerCase();if(!q)return;const r=[];DB.vessels.filter(v=>(v.name+v.model).toLowerCase().includes(q)).slice(0,6).forEach(v=>r.push(['Vessel',v.name+' - '+v.model,'vessel:'+v.id]));DB.crew.filter(c=>c.name.toLowerCase().includes(q)).slice(0,6).forEach(c=>r.push(['Crew',c.name+' - '+c.role,'crew:'+c.id]));DB.bookings.filter(b=>(b.id+CU(b.cust).name).toLowerCase().includes(q)).slice(0,6).forEach(b=>r.push(['Booking',b.id+' - '+CU(b.cust).name,'booking:'+b.id]));DB.customers.filter(c=>c.name.toLowerCase().includes(q)).slice(0,4).forEach(c=>r.push(['Guest',c.name,'guest:'+c.id]));
  modal('Search results for "'+E(q)+'"',r.length?`<div class="list">${r.map(x=>`<div class="li clk" data-act="${x[2]}">${chip(x[0],'b')}<span>${E(x[1])}</span></div>`).join('')}</div>`:'<div class="mu ctr" style="padding:24px">No matches found</div>','sm')}
let _rs;window.addEventListener('resize',()=>{clearTimeout(_rs);_rs=setTimeout(paintCharts,80)});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==S.mod+'/'+S.tab&&MODS[h.split('/')[0]])go(h)});
(async function init(){try{await loadData()}catch(e){document.body.innerHTML='<div style="padding:40px">Unable to load the demo data: '+E(e.message)+'</div>';return}
  const h=location.hash.slice(1);if(h&&MODS[h.split('/')[0]]){S.mod=h.split('/')[0];S.tab=h.split('/')[1]||null}
  render()})();

</script>
</body></html>
